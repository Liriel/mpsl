<div class="create-list-drawer">
  <div class="drawer-header">
    <h2>Create New Shopping List</h2>
  </div>

  <form [formGroup]="createForm" (ngSubmit)="onSubmit()" class="drawer-form">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>List Name</mat-label>
      <input matInput
        formControlName="name"
        placeholder="Enter list name"
        autocomplete="off">
      @if (nameControl?.invalid && nameControl?.touched) {
        <mat-error>
          {{ getErrorMessage() }}
        </mat-error>
      }
    </mat-form-field>

    @if (saveError) {
      <mat-error class="save-error">{{saveError}}</mat-error>
    }

    <div class="drawer-actions">
      <button mat-button
        type="button"
        (click)="onCancel()"
        [disabled]="isLoading">
        Cancel
      </button>
      <button mat-raised-button
        color="primary"
        type="submit"
        [disabled]="createForm.invalid || isLoading">
        @if (!isLoading) {
          <span>Create List</span>
        }
        @if (isLoading) {
          <span>Creating...</span>
        }
      </button>
    </div>
  </form>
</div>
