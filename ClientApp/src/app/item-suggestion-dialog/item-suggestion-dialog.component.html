<h2 mat-dialog-title>Did you mean &hellip;?</h2>

<mat-dialog-content>
  <mat-action-list>
    @for (s of data.suggestions; track s.id) {
      <button mat-list-item [mat-dialog-close]="s.name">
        <span matListItemTitle>{{ s.name }}</span>
        @if (s.purchaseCount > 0) {
          <span matListItemLine class="purchase-count">{{ s.purchaseCount }}&times; bought</span>
        }
      </button>
    }
  </mat-action-list>
</mat-dialog-content>

<mat-dialog-actions>
  <button mat-button [mat-dialog-close]="undefined">Cancel</button>
  <button mat-raised-button color="primary" [mat-dialog-close]="null" cdkFocusInitial>
    Add &ldquo;{{ data.name }}&rdquo; as new
  </button>
</mat-dialog-actions>
